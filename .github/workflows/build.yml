name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # release upload needs this when a tag triggers the workflow

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  WAILS_VERSION: 'v2.12.0'
  APP_ARTIFACT_NAME: 'AT.Term'

jobs:
  build-linux:
    name: linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: install wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install frontend deps
        working-directory: desktop/frontend
        run: npm ci

      # desktop/main.go has //go:embed all:frontend/dist — Go demands the
      # directory exists at compile time even for `vet`. Build the frontend
      # before any Go tooling touches the desktop package.
      - name: build frontend (populate embed target)
        working-directory: desktop/frontend
        run: npm run build

      - name: vet
        run: go vet -tags webkit2_41 ./...

      - name: e2e test (lazy uplink protocol)
        # The lazy-uplink e2e exercises relay/session behavior that is not
        # architecture-specific; run it once on amd64 so arm64 packaging is
        # not blocked by the hosted arm runner's PTY timing differences.
        if: matrix.arch == 'amd64'
        run: go test -tags webkit2_41 -timeout 60s ./desktop/

      - name: prepare release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/set-wails-version.mjs desktop/wails.json "${GITHUB_REF_NAME#v}"

      - name: build
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: wails build -tags webkit2_41 -platform linux/${{ matrix.arch }} -s -ldflags "-X main.Version=$VERSION"

      - name: package updater archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd desktop/build/bin
          tar -czf "atterm-desktop-linux-${{ matrix.arch }}.tar.gz" atterm-desktop
          ls -la "atterm-desktop-linux-${{ matrix.arch }}.tar.gz"

      - name: package deb
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_NAME: ${{ env.APP_ARTIFACT_NAME }}
        run: .github/scripts/package-linux-deb.sh

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: atterm-desktop-linux-${{ matrix.arch }}
          path: |
            desktop/build/bin/${{ env.APP_ARTIFACT_NAME }}_*_${{ matrix.arch }}.deb
            desktop/build/bin/atterm-desktop-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  build-darwin:
    name: darwin/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: amd64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: install wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install frontend deps
        working-directory: desktop/frontend
        run: npm ci

      - name: build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: prepare release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/set-wails-version.mjs desktop/wails.json "${GITHUB_REF_NAME#v}"

      - name: build
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: wails build -platform darwin/${{ matrix.arch }} -s -ldflags "-X main.Version=$VERSION"

      - name: package updater archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd desktop/build/bin
          ditto -c -k --keepParent atterm-desktop.app "atterm-desktop-darwin-${{ matrix.arch }}.zip"
          ls -la "atterm-desktop-darwin-${{ matrix.arch }}.zip"

      - name: package dmg
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_NAME: ${{ env.APP_ARTIFACT_NAME }}
        run: .github/scripts/package-macos-dmg.sh

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: atterm-desktop-darwin-${{ matrix.arch }}
          path: |
            desktop/build/bin/${{ env.APP_ARTIFACT_NAME }}_*_${{ matrix.arch }}.dmg
            desktop/build/bin/atterm-desktop-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-windows:
    name: windows/amd64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash # use Git Bash so the recipes match the other jobs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: install wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install frontend deps
        working-directory: desktop/frontend
        run: npm ci

      - name: build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: prepare release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/set-wails-version.mjs desktop/wails.json "${GITHUB_REF_NAME#v}"

      - name: build NSIS installer
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: wails build -platform windows/amd64 -nsis -s -ldflags "-X main.Version=$VERSION"

      - name: package updater archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd desktop/build/bin
          test -f atterm-desktop.exe
          7z a "atterm-desktop-windows-amd64.zip" atterm-desktop.exe
          ls -la "atterm-desktop-windows-amd64.zip"

      - name: stage installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          ARTIFACT_NAME: ${{ env.APP_ARTIFACT_NAME }}
        run: |
          set -euo pipefail
          version_no_v="${VERSION#v}"
          src="desktop/build/bin/atterm-desktop-amd64-installer.exe"
          dst="desktop/build/bin/${ARTIFACT_NAME}_${version_no_v}_amd64.exe"
          test -f "$src"
          mv "$src" "$dst"
          ls -la "$dst"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: atterm-desktop-windows-amd64
          path: |
            desktop/build/bin/${{ env.APP_ARTIFACT_NAME }}_*_amd64.exe
            desktop/build/bin/atterm-desktop-windows-amd64.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: list
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
