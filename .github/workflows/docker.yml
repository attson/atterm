name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel an in-progress run when a newer push lands on the same ref.
# Each tag gets its own group, so a release in flight is never aborted
# by an unrelated dispatch.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE: attson/atterm-relay

jobs:
  relay:
    name: relay image
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: describe version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: docker tags
        id: docker-tags
        shell: bash
        # Releases (tag push) get :vX.Y.Z + :vX.Y (major.minor line).
        # No :latest — ops pin a major.minor line (e.g. :v0.2) to lock a
        # release line and still pick up patch updates automatically.
        # Manual dispatch from a non-tag ref gets :dev only — never a release
        # tag, so production deployments are not surprised by a non-release build.
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            # Major.minor line, e.g. v0.2.1 -> v0.2 (assumes vX.Y.Z tags).
            minor="v$(printf '%s' "${version#v}" | cut -d. -f1-2)"
            {
              echo "tags<<EOF"
              echo "${DOCKER_IMAGE}:${version}"
              echo "${DOCKER_IMAGE}:${minor}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${DOCKER_IMAGE}:dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.docker-tags.outputs.tags }}
