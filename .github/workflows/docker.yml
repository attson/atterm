name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: attson/atterm-relay

jobs:
  relay:
    name: relay image
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: describe version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: docker tags
        id: docker-tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            bare="${version#v}"
            {
              echo "tags<<EOF"
              echo "${DOCKER_IMAGE}:latest"
              echo "${DOCKER_IMAGE}:${version}"
              echo "${DOCKER_IMAGE}:${bare}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${DOCKER_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.docker-tags.outputs.tags }}
