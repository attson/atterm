name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel an in-progress run when a newer push lands on the same ref.
# Each tag gets its own group, so a release in flight is never aborted
# by an unrelated dispatch.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE: attson/atterm-relay

jobs:
  relay:
    name: relay image
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: describe version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: docker tags
        id: docker-tags
        shell: bash
        # Releases (tag push) get :latest + :vX.Y.Z + :X.Y.Z.
        # Manual dispatch from a non-tag ref gets :dev only — never touches
        # :latest, so production watchtower deployments are not surprised
        # by a non-release build.
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            bare="${version#v}"
            {
              echo "tags<<EOF"
              echo "${DOCKER_IMAGE}:latest"
              echo "${DOCKER_IMAGE}:${version}"
              echo "${DOCKER_IMAGE}:${bare}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${DOCKER_IMAGE}:dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.docker-tags.outputs.tags }}
