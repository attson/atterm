name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'desktop/frontend/src/**'
      - 'desktop/frontend/package.json'
      - 'desktop/frontend/package-lock.json'
      - 'web/src/shared/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            web/package-lock.json
            site/package-lock.json
      # 首页 demo 通过 vite alias 复用 desktop/frontend 与 web 的源码,其 import
      # 的三方包需在解析路径上可用,因此这两处依赖也要装。
      - name: Install desktop frontend deps
        working-directory: desktop/frontend
        run: npm ci
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Test mock layer
        working-directory: site
        run: npm test
      - name: Build
        working-directory: site
        run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/docs/.vitepress/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 首次部署前需在仓库 Settings → Pages → Source 选择「GitHub Actions」,
      # 否则本步骤会 403 失败。
      - id: deployment
        uses: actions/deploy-pages@v5
