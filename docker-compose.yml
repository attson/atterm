services:
  atterm-relay:
    image: ${ATTERM_RELAY_IMAGE:-attson/atterm-relay:latest}
    container_name: atterm-relay
    restart: unless-stopped
    environment:
      # Override in your shell or a local .env file before starting.
      ATTERM_TOKEN: ${ATTERM_TOKEN:-dev}
      ATTERM_RELAY_DEBUG: ${ATTERM_RELAY_DEBUG:-0}
      ATTERM_RELAY_DEBUG_PAYLOAD: ${ATTERM_RELAY_DEBUG_PAYLOAD:-0}
    ports:
      - "${ATTERM_RELAY_PORT:-8080}:8080"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command: ["--addr", ":8080", "--web", "/app/web"]

  watchtower:
    image: containrrr/watchtower:latest
    container_name: atterm-watchtower
    profiles: ["auto-update"]
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${ATTERM_WATCHTOWER_INTERVAL:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
