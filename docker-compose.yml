services:
  atterm-relay:
    image: ${ATTERM_RELAY_IMAGE:-attson/atterm-relay:latest}
    container_name: atterm-relay
    restart: unless-stopped
    environment:
      # Required for public listen: email of the bootstrap admin user.
      # On startup the relay marks this user as admin; if they don't
      # exist yet, set ATTERM_BOOTSTRAP_ADMIN_PASSWORD below to provision
      # a new account. After the user exists you can unset PASSWORD and
      # restart (the email-only env stays idempotent).
      ATTERM_BOOTSTRAP_ADMIN_EMAIL: ${ATTERM_BOOTSTRAP_ADMIN_EMAIL:-}
      # Used only when creating a brand-new admin user. Must be ≥16 chars,
      # ≥3 character classes (upper / lower / digit / symbol), not in the
      # bootstrap blacklist (dev / changeme / 12345 / ...). UNSET this
      # after the user is created — it's a long-lived disk secret.
      ATTERM_BOOTSTRAP_ADMIN_PASSWORD: ${ATTERM_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Required for non-insecure public relay startup. Set this to the exact
      # browser origin, e.g. https://relay.example.com.
      ATTERM_ORIGINS: ${ATTERM_ORIGINS:-http://localhost:8080}
      # Directory the relay uses for persistent state: users.db (SQLite),
      # web-push.json, and the admin config JSON. Must match the volume
      # bind mount below so data survives container restarts.
      ATTERM_RELAY_CONFIG_DIR: /etc/atterm
      ATTERM_RELAY_CONFIG: ${ATTERM_RELAY_CONFIG:-/etc/atterm/relay.json}
      ATTERM_VAPID_SUBJECT: ${ATTERM_VAPID_SUBJECT:-mailto:noreply@atterm.local}
      ATTERM_RATE_LIMIT_PER_MINUTE: ${ATTERM_RATE_LIMIT_PER_MINUTE:-0}
      ATTERM_MAX_CONNECTIONS_PER_KEY: ${ATTERM_MAX_CONNECTIONS_PER_KEY:-0}
      ATTERM_RELAY_DEBUG: ${ATTERM_RELAY_DEBUG:-0}
      ATTERM_RELAY_DEBUG_PAYLOAD: ${ATTERM_RELAY_DEBUG_PAYLOAD:-0}
    ports:
      - "${ATTERM_RELAY_PORT:-8080}:8080"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command: ["--addr", ":8080"]
    volumes:
      - ${ATTERM_RELAY_CONFIG_DIR:-./data/atterm-relay}:/etc/atterm

  watchtower:
    image: containrrr/watchtower:latest
    container_name: atterm-watchtower
    profiles: ["auto-update"]
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${ATTERM_WATCHTOWER_INTERVAL:-300}
      # Newer Docker daemons reject very old client API versions. Keep
      # watchtower on the daemon-supported floor used by modern engines.
      DOCKER_API_VERSION: "${ATTERM_WATCHTOWER_DOCKER_API_VERSION:-1.40}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
