services:
  atterm-relay:
    image: ${ATTERM_RELAY_IMAGE:-attson/atterm-relay:latest}
    container_name: atterm-relay
    restart: unless-stopped
    # Most settings now live in <config-dir>/relay.json and are managed at
    # runtime under Admin → Config / Feishu (no restart). Only the essentials
    # below are env; the optional ones are honored as a one-time seed into
    # relay.json on first boot.
    environment:
      # Bootstrap admin email. On boot the relay prints a single-use claim
      # token to the logs; complete OPAQUE registration (set your password in
      # the web UI's register flow) with that token to create the account and
      # get the admin role. Idempotent once the user exists. Required for a
      # public relay unless started with --dev-insecure.
      ATTERM_BOOTSTRAP_ADMIN_EMAIL: ${ATTERM_BOOTSTRAP_ADMIN_EMAIL:-}
      # Browser Origin allow-list, e.g. https://relay.example.com. Required for
      # a public relay (unless --dev-insecure). Seeds relay.json; editable later
      # under Admin → Config.
      ATTERM_ORIGINS: ${ATTERM_ORIGINS:-http://localhost:8080}
      # Persistent state dir: users.db (SQLite), relay.json (admin config),
      # web-push.json. Must match the volume bind mount below so data survives
      # restarts.
      ATTERM_RELAY_CONFIG_DIR: /etc/atterm
      # Optional config-file path override (defaults to <config-dir>/relay.json).
      ATTERM_RELAY_CONFIG: ${ATTERM_RELAY_CONFIG:-/etc/atterm/relay.json}
      # TLS: the relay serves HTTPS on :8443 by default with a self-signed
      # cert (browsers warn once). Set ATTERM_TLS_HOST to your public IP or
      # domain so the cert matches and the warning is host-correct. OPAQUE
      # login REQUIRES https (or localhost) — plain http won't work in a
      # browser. Bring your own cert with ATTERM_TLS_CERT/ATTERM_TLS_KEY, or
      # front the :8080 HTTP port with Caddy/nginx/Tailscale for a real cert.
      ATTERM_TLS_HOST: ${ATTERM_TLS_HOST:-}
      # ── Optional (configure in the admin UI instead) ────────────────────
      # All of the following are OPTIONAL and now managed under Admin →
      # Config / Feishu. Set them here only to pre-seed relay.json on first
      # boot; afterwards the admin UI is the source of truth:
      #   ATTERM_FEISHU_ENCRYPT_KEY   (base64 32 bytes — admin UI can generate)
      #   ATTERM_FEISHU_BASE_URL
      #   ATTERM_VAPID_SUBJECT        (change needs a restart)
      #   ATTERM_RATE_LIMIT_PER_MINUTE / ATTERM_MAX_CONNECTIONS_PER_KEY
      #   ATTERM_RELAY_DEBUG / ATTERM_RELAY_DEBUG_PAYLOAD (verbose logging)
    ports:
      # HTTPS (self-signed) — the browser-facing port. Open https://<host>:8443.
      - "${ATTERM_RELAY_HTTPS_PORT:-8443}:8443"
      # Plain HTTP — for a reverse proxy that terminates TLS, or internal use.
      # Not usable directly from a browser (OPAQUE needs a secure context).
      - "${ATTERM_RELAY_PORT:-8080}:8080"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # Both listeners are on by default (--https-addr defaults to :8443).
    command: ["--addr", ":8080", "--https-addr", ":8443"]
    volumes:
      - ${ATTERM_RELAY_CONFIG_DIR:-./data/atterm-relay}:/etc/atterm

  watchtower:
    image: containrrr/watchtower:latest
    container_name: atterm-watchtower
    profiles: ["auto-update"]
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${ATTERM_WATCHTOWER_INTERVAL:-300}
      # Newer Docker daemons reject very old client API versions. Keep
      # watchtower on the daemon-supported floor used by modern engines.
      DOCKER_API_VERSION: "${ATTERM_WATCHTOWER_DOCKER_API_VERSION:-1.40}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
