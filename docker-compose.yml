services:
  atterm-relay:
    image: ${ATTERM_RELAY_IMAGE:-attson/atterm-relay:latest}
    container_name: atterm-relay
    restart: unless-stopped
    # All runtime settings are stored in the DB. relay.json and web-push.json
    # are no longer written or read. The env vars below seed the DB on first
    # boot only; afterwards the admin UI (Admin → Config / Feishu) is the
    # source of truth.
    #
    # Storage: this compose runs a bundled Postgres alongside the relay
    # (ATTERM_RELAY_DB_DRIVER=postgres). For multi-instance deployments,
    # point every relay instance at the same external Postgres instead of
    # the bundled one — admin config changes propagate to other instances
    # within ~10 s (config refresher TTL). rate_limit_per_minute and
    # max_connections_per_key remain per-instance.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Bootstrap admin email. On boot the relay prints a single-use claim
      # token to the logs; complete OPAQUE registration (set your password in
      # the web UI's register flow) with that token to create the account and
      # get the admin role. Idempotent once the user exists. Required for a
      # public relay unless started with --dev-insecure.
      ATTERM_BOOTSTRAP_ADMIN_EMAIL: ${ATTERM_BOOTSTRAP_ADMIN_EMAIL:-}
      # Browser Origin allow-list, e.g. https://relay.example.com. Required for
      # a public relay (unless --dev-insecure). Seeds the DB on first boot;
      # editable later under Admin → Config.
      ATTERM_ORIGINS: ${ATTERM_ORIGINS:-http://localhost:8080}
      # ── DB backend: bundled Postgres ─────────────────────────────────────
      # To use an external Postgres (multi-instance / managed DB), override
      # ATTERM_RELAY_DB_DSN and remove the `postgres` service + depends_on.
      ATTERM_RELAY_DB_DRIVER: postgres
      ATTERM_RELAY_DB_DSN: ${ATTERM_RELAY_DB_DSN:-postgres://atterm:${ATTERM_PG_PASSWORD:-atterm}@postgres:5432/atterm?sslmode=disable}
      # Public URL of this relay instance. Optional for single-instance
      # deployments; required for multi-instance (each instance sets its own
      # externally-reachable URL — this is the instance_id used for the
      # relay_instances heartbeat and home-node routing).
      ATTERM_RELAY_INSTANCE_PUBLIC_URL: ${ATTERM_RELAY_INSTANCE_PUBLIC_URL:-}
      # TLS: this compose serves plain HTTP on :8080 and expects a
      # TLS-terminating proxy (Cloudflare/Caddy/nginx/Tailscale) in front —
      # OPAQUE login REQUIRES a secure context (https or localhost), so the
      # browser must reach the relay over https. There is NO self-signed cert.
      # To serve HTTPS directly instead, mount a real cert, set
      # ATTERM_TLS_CERT/ATTERM_TLS_KEY, add the :8443 port below, and pass
      # --https-addr :8443 in command.
      #   ATTERM_TLS_CERT: /etc/atterm/tls/fullchain.pem
      #   ATTERM_TLS_KEY:  /etc/atterm/tls/privkey.pem
      # ── Optional (configure in the admin UI instead) ────────────────────
      # All of the following are OPTIONAL and managed under Admin → Config /
      # Feishu. Set them here only to pre-seed the DB on first boot:
      #   ATTERM_FEISHU_ENCRYPT_KEY   (base64 32 bytes — admin UI can generate)
      #   ATTERM_FEISHU_BASE_URL
      #   ATTERM_VAPID_SUBJECT        (change needs a restart)
      #   ATTERM_RATE_LIMIT_PER_MINUTE / ATTERM_MAX_CONNECTIONS_PER_KEY (per-instance)
      #   ATTERM_RELAY_DEBUG / ATTERM_RELAY_DEBUG_PAYLOAD (verbose logging)
    ports:
      # Plain HTTP — put a TLS-terminating proxy (Cloudflare/Caddy/nginx) in
      # front. Not usable directly from a browser (OPAQUE needs a secure context).
      - "${ATTERM_RELAY_PORT:-8080}:8080"
      # To serve HTTPS directly with your own cert, also expose:
      # - "${ATTERM_RELAY_HTTPS_PORT:-8443}:8443"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # HTTP only by default (front with a proxy for TLS). For direct HTTPS add
    # "--https-addr", ":8443" here and set ATTERM_TLS_CERT/ATTERM_TLS_KEY.
    command: ["--addr", ":8080"]

  postgres:
    image: ${ATTERM_PG_IMAGE:-postgres:16-alpine}
    container_name: atterm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atterm
      POSTGRES_PASSWORD: ${ATTERM_PG_PASSWORD:-atterm}
      POSTGRES_DB: atterm
    volumes:
      - ${ATTERM_PG_DATA_DIR:-./data/atterm-postgres}:/var/lib/postgresql/data
    # Not exposed to the host by default — relay reaches it over the compose
    # network. Uncomment to expose for external psql/backups.
    # ports:
    #   - "${ATTERM_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atterm -d atterm"]
      interval: 5s
      timeout: 3s
      retries: 20

  watchtower:
    image: ${ATTERM_WATCHTOWER_IMAGE:-containrrr/watchtower:1.7.1}
    container_name: atterm-watchtower
    profiles: ["auto-update"]
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${ATTERM_WATCHTOWER_INTERVAL:-300}
      # Newer Docker daemons reject very old client API versions. Keep
      # watchtower on the daemon-supported floor used by modern engines.
      DOCKER_API_VERSION: "${ATTERM_WATCHTOWER_DOCKER_API_VERSION:-1.40}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
