<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AT Term" />
<title>AT Term</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="vendor/xterm/xterm.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app-shell">
  <header id="topbar">
    <button id="back" class="ghost-btn" hidden aria-label="Back to sessions">←</button>
    <div class="brand-block">
      <div class="brand">AT Term</div>
      <div class="subtitle" id="session-title">mobile relay</div>
      <div class="version" id="version">version dev</div>
    </div>
    <div class="status" id="status">disconnected</div>
    <button id="logout" class="ghost-btn" type="button">Sign out</button>
  </header>

  <section id="install-hint" class="install-hint" hidden>
    <div>
      <strong>install AT Term</strong>
      <span>on iPhone, open this site with HTTPS, then tap Share → Add to Home Screen.</span>
    </div>
    <button id="install-dismiss" type="button" aria-label="Dismiss install hint">×</button>
  </section>

  <main id="main">
    <section id="list-view">
      <div class="section-head">
        <h1>active sessions</h1>
        <button id="refresh" type="button">refresh</button>
      </div>
      <div id="list"></div>
      <div id="empty" hidden>no live sessions. start one from AT Term or <code>atterm-agent</code>.</div>
    </section>

    <section id="term-view" hidden>
      <div id="term"></div>
      <div id="replay-progress" hidden>
        <div id="replay-progress-text">loading history…</div>
        <div class="replay-progress-track" aria-hidden="true">
          <div id="replay-progress-fill"></div>
        </div>
      </div>
      <div id="shortcut-bar" aria-label="terminal shortcuts">
        <button data-shortcut="esc" type="button">Esc</button>
        <button data-shortcut="tab" type="button">Tab</button>
        <button data-shortcut="ctrl-c" type="button">Ctrl-C</button>
        <button data-shortcut="ctrl-d" type="button">Ctrl-D</button>
        <button data-shortcut="left" type="button">←</button>
        <button data-shortcut="down" type="button">↓</button>
        <button data-shortcut="up" type="button">↑</button>
        <button data-shortcut="right" type="button">→</button>
        <button id="copy" type="button">Copy</button>
        <button id="paste" type="button">Paste</button>
      </div>
      <form id="paste-fallback" hidden>
        <textarea id="paste-text" rows="3" placeholder="paste text here"></textarea>
        <div class="paste-actions">
          <label class="paste-image-pick" for="paste-image-file">pick image</label>
          <input id="paste-image-file" type="file" accept="image/*" hidden />
          <button type="button" id="paste-cancel">cancel</button>
          <button type="submit">send</button>
        </div>
      </form>
    </section>
  </main>
</div>

<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm-addon-fit/xterm-addon-fit.js"></script>
<script type="module" src="app.js"></script>
<script type="module">
  import { logout } from "./auth.js";
  document.getElementById("logout").addEventListener("click", () => logout());
</script>
</body>
</html>
