<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AT Term · sign up</title>
<link rel="stylesheet" href="style.css" />
</head><body class="auth-page">
<form id="signup-form" class="auth-card" autocomplete="on">
  <h1>AT Term</h1>
  <label>Email <input id="email" type="email" required autocomplete="username" /></label>
  <label>Password <input id="password" type="password" required autocomplete="new-password" /></label>
  <label>Invite code <input id="invite" type="text" required autocomplete="off" /></label>
  <button type="submit">Create account</button>
  <p id="error" hidden></p>
  <p class="alt">Already have an account? <a href="/login.html">Sign in</a>.</p>
</form>
<script type="module">
import { signup } from "./auth.js";
document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("error");
    err.hidden = true;
    try {
        await signup(
            document.getElementById("email").value,
            document.getElementById("password").value,
            document.getElementById("invite").value,
        );
        location.assign("/");
    } catch (e) {
        err.textContent = "Sign-up failed. Check your invite code and try again.";
        err.hidden = false;
    }
});
</script></body></html>
